name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt pip-audit==2.10.1
      - run: python -m unittest discover -s tests
      - run: node --check web/static/app.js && node --check web/static/finish.js
      - run: bash -n scripts/run_web_gx10.sh
      - run: pip-audit -r requirements-web.txt
